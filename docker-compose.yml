# ─────────────────────────────────────────────────────────────────
# Buzzy — docker-compose (production / Coolify)
#
# • Déploiement Coolify : ce fichier suffit. Coolify utilise UNIQUEMENT
#   docker-compose.yml (il n'applique pas docker-compose.override.yml).
#   La variable magique SERVICE_FQDN_APP_3000 fait générer un domaine
#   à Coolify et configure automatiquement le reverse-proxy vers le
#   port 3000. Renseignez les secrets (JWT_SECRET, ENCRYPTION_KEY,
#   ADMIN_PASSWORD, POSTGRES_PASSWORD…) dans l'UI Coolify.
#
# • Développement local : `docker compose up -d --build` fusionne
#   automatiquement docker-compose.override.yml, qui publie le port
#   3000 sur l'hôte et ajoute la recherche web SearXNG.
# ─────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify : génère un domaine et route le proxy vers le port 3000.
      # Sans Coolify, cette variable reste vide et est ignorée.
      SERVICE_FQDN_APP_3000: ''
      # Se déduit automatiquement des variables POSTGRES_* : définir seulement
      # POSTGRES_PASSWORD suffit, l'URL reste cohérente (cause n°1 des boucles
      # de redémarrage : un mot de passe changé d'un côté seulement).
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-buzzy}:${POSTGRES_PASSWORD:-buzzy}@db:5432/${POSTGRES_DB:-buzzy}}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-bytes-long-secret!!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      PORT: 3000
      NODE_ENV: production
      # Serveurs de recherche web MCP livrés avec la stack (ci-dessous).
      # Pré-enregistrés DÉSACTIVÉS dans Buzzy au démarrage ; il reste à les
      # cocher dans Paramètres → Recherche Web (MCP).
      # Laisser une valeur vide pour ne pas pré-enregistrer le serveur.
      SEARXNG_MCP_URL: ${SEARXNG_MCP_URL:-http://searxng-mcp:8000/mcp}
      MCP_FETCH_URL: ${MCP_FETCH_URL:-http://mcp-fetch:8000/mcp}
      MCP_TIME_URL: ${MCP_TIME_URL:-http://mcp-time:8000/mcp}
    # Port interne exposé au réseau Docker / au proxy Coolify (pas à l'hôte).
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # ─── Alternative sans la variable magique : labels Traefik ────────
    # (à décommenter et adapter le domaine si vous gérez le proxy vous-même)
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.buzzy.rule=Host(`buzzy.exemple.com`)"
    #   - "traefik.http.routers.buzzy.entrypoints=websecure"
    #   - "traefik.http.routers.buzzy.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.buzzy.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buzzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buzzy}
      POSTGRES_DB: ${POSTGRES_DB:-buzzy}
    volumes:
      - buzzy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-buzzy} -d ${POSTGRES_DB:-buzzy}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  # Recherche web MCP 100% gratuite et auto-hébergée (SearXNG).
  #
  # Déployée par défaut (pas de profil Compose : Coolify ne transmet pas
  # COMPOSE_PROFILES à la commande `docker compose`, les services ne
  # démarreraient jamais). Elle reste INACTIVE côté application tant que
  # le serveur MCP n'est pas activé dans Paramètres → Recherche Web (MCP).
  #
  # Pour ne pas déployer SearXNG du tout, supprimez ces deux services et
  # laissez SEARXNG_MCP_URL vide.
  # ─────────────────────────────────────────────────────────────────
  searxng:
    # Image construite avec la configuration intégrée (pas de bind mount :
    # celui-ci échoue sur Coolify, où le dépôt n'est pas monté à l'exécution).
    build:
      context: .
      dockerfile: searxng/Dockerfile
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-buzzy-searxng-change-me-please-0123456789}
    expose:
      - '8080'

  searxng-mcp:
    build:
      context: .
      dockerfile: searxng-mcp/Dockerfile
    restart: unless-stopped
    depends_on:
      - searxng
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_PORT: '8000'
    expose:
      - '8000'

  # ─────────────────────────────────────────────────────────────────
  # Serveurs MCP officiels (modelcontextprotocol/servers) — gratuits,
  # sans clé API. Complètent la recherche pour fiabiliser les résultats :
  #   • mcp-fetch : ouvre réellement une page trouvée et en lit le contenu
  #                 → vérifie qu'un événement et son URL existent vraiment
  #   • mcp-time  : donne la date réelle du jour (évite les erreurs d'année)
  # ─────────────────────────────────────────────────────────────────
  mcp-fetch:
    build:
      context: .
      dockerfile: mcp-fetch/Dockerfile
    restart: unless-stopped
    environment:
      MCP_PORT: '8000'
    expose:
      - '8000'

  mcp-time:
    build:
      context: .
      dockerfile: mcp-time/Dockerfile
    restart: unless-stopped
    environment:
      MCP_PORT: '8000'
      LOCAL_TIMEZONE: ${LOCAL_TIMEZONE:-Europe/Paris}
    expose:
      - '8000'

volumes:
  buzzy_postgres_data:
