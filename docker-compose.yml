# ─────────────────────────────────────────────────────────────────
# Buzzy — docker-compose (production / Coolify)
#
# • Déploiement Coolify : ce fichier suffit. Coolify utilise UNIQUEMENT
#   docker-compose.yml (il n'applique pas docker-compose.override.yml).
#   La variable magique SERVICE_FQDN_APP_3000 fait générer un domaine
#   à Coolify et configure automatiquement le reverse-proxy vers le
#   port 3000. Renseignez les secrets (JWT_SECRET, ENCRYPTION_KEY,
#   ADMIN_PASSWORD, POSTGRES_PASSWORD…) dans l'UI Coolify.
#
# • Développement local : `docker compose up -d --build` fusionne
#   automatiquement docker-compose.override.yml, qui publie le port
#   3000 sur l'hôte et ajoute la recherche web SearXNG.
# ─────────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Coolify : génère un domaine et route le proxy vers le port 3000.
      # Sans Coolify, cette variable reste vide et est ignorée.
      SERVICE_FQDN_APP_3000: ''
      DATABASE_URL: ${DATABASE_URL:-postgresql://buzzy:buzzy@db:5432/buzzy}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-change-me-32-bytes-long-secret!!}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      PORT: 3000
      NODE_ENV: production
      # Recherche web SearXNG : renseignez cette variable ET COMPOSE_PROFILES=searxng
      # pour l'activer (voir le bloc searxng plus bas). Laissée vide, elle est ignorée.
      SEARXNG_MCP_URL: ${SEARXNG_MCP_URL:-}
    # Port interne exposé au réseau Docker / au proxy Coolify (pas à l'hôte).
    expose:
      - '3000'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    # ─── Alternative sans la variable magique : labels Traefik ────────
    # (à décommenter et adapter le domaine si vous gérez le proxy vous-même)
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.buzzy.rule=Host(`buzzy.exemple.com`)"
    #   - "traefik.http.routers.buzzy.entrypoints=websecure"
    #   - "traefik.http.routers.buzzy.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.buzzy.loadbalancer.server.port=3000"

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-buzzy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-buzzy}
      POSTGRES_DB: ${POSTGRES_DB:-buzzy}
    volumes:
      - buzzy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-buzzy} -d ${POSTGRES_DB:-buzzy}']
      interval: 5s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────
  # Recherche web MCP 100% gratuite et auto-hébergée (SearXNG).
  # DÉSACTIVÉE par défaut via le profil Docker Compose « searxng ».
  #
  # Pour l'ACTIVER (sans éditer ce fichier), définissez DEUX variables
  # d'environnement (dans l'UI Coolify, ou dans .env en local) :
  #     COMPOSE_PROFILES=searxng
  #     SEARXNG_MCP_URL=http://searxng-mcp:8000/mcp
  # Puis (re)déployez. Le serveur MCP est pré-enregistré (désactivé) dans
  # Buzzy ; activez-le dans Paramètres → Recherche Web (MCP).
  # ─────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    profiles: ['searxng']
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    expose:
      - '8080'

  searxng-mcp:
    build:
      context: .
      dockerfile: searxng-mcp/Dockerfile
    restart: unless-stopped
    profiles: ['searxng']
    depends_on:
      - searxng
    environment:
      SEARXNG_URL: http://searxng:8080
      MCP_PORT: '8000'
    expose:
      - '8000'

volumes:
  buzzy_postgres_data:
