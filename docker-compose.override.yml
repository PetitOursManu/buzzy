# ─────────────────────────────────────────────────────────────────
# Override local — chargé AUTOMATIQUEMENT par `docker compose up`
# (et IGNORÉ par Coolify, qui n'utilise que docker-compose.yml).
#
# Rôle : publier le port de l'app sur l'hôte pour un accès direct à
# http://localhost:3000 en développement. En production, c'est le
# reverse-proxy (Coolify/Traefik) qui expose l'application.
#
# Les serveurs de recherche web MCP (SearXNG, Fetch, Time) sont définis
# dans docker-compose.yml et démarrent avec la stack : aucun profil ni
# variable à positionner. Ils restent inactifs côté application tant
# qu'ils ne sont pas cochés dans Paramètres → Recherche Web (MCP).
# ─────────────────────────────────────────────────────────────────

services:
  app:
    ports:
      - '3000:3000'
